{% set name = "vl-convert-python" %}
{% set version = "1.9.0.post1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/vl_convert_python-{{ version }}.tar.gz
  sha256: a5b06b3128037519001166f5341ec7831e19fbd7f3a5f78f73d557ac2d5859ef
  patches:
    - 01-fix-libffi-msvc.patch

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv
  skip: true  # [aarch64 and python_impl == 'pypy']

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('c') }}        # [not win]
    - {{ stdlib('c') }}
    - make                       # [not win]
    - cmake
    - rust >=1.64.0
    - protobuf
    - libffi  # [win]
  host:
    - python
    - pip
    - maturin
  run:
    - python

test:
  imports:
    - vl_convert
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/jonmmease/vl-convert
  summary: Convert Vega-Lite chart specifications to SVG, PNG, or Vega
  license: BSD-3-Clause
  license_file:
    - vl-convert-python/LICENSE
    - vl-convert-python/thirdparty_font.md
    - vl-convert-python/thirdparty_javascript.md
    - vl-convert-python/thirdparty_rust.yaml

extra:
  recipe-maintainers:
    - jonmmease
    - pb01ka
